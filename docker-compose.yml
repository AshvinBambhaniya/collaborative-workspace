version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pm_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: purple_merit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pm_network

  mongo:
    image: mongo:6.0
    container_name: pm_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - pm_network

  redis:
    image: redis:7-alpine
    container_name: pm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pm_network

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: pm_backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    depends_on:
      - postgres
      - mongo
      - redis
    networks:
      - pm_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pm_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:

networks:
  pm_network:
    driver: bridge